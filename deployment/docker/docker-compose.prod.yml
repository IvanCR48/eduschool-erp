version: '3.8'

# Configuración optimizada para producción
services:
  database:
    image: mysql:8.0
    container_name: sistema_admin_db_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./database/school_admin.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - sistema_network_prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp
      - /var/run/mysqld
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sistema_admin_web_prod
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      SESSION_LIFETIME: 120
      MAX_LOGIN_ATTEMPTS: 5
      LOG_LEVEL: error
    volumes:
      - ./logs:/var/www/html/logs
      - ./backups:/var/www/html/backups
      - ./uploads:/var/www/html/uploads
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - database
    networks:
      - sistema_network_prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/nginx
      - /var/log/supervisor
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: sistema_admin_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - sistema_network_prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  sistema_network_prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
